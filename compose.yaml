name: psb-legal-assistant

services:
  web:
    build: .
    image: psb-legal-assistant
    env_file: .env
    environment:
      DATA_DIR: /kb
      KB_DIR: /kb/knowledge-base
    ports:
      - "8000:8000"
    volumes:
      - ./data:/kb:ro
      - cache:/app/data/cache
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  cache:
